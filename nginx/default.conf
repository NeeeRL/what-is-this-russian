
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Next.jsの静的ページ
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # HTMLファイルのキャッシュを抑制
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ゲームの静的ファイル
    location /game-assets/ {
        try_files $uri =404;
    }

    # WebAssembly
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        default_type application/wasm;
    }

    # 圧縮
    gzip on;
    gzip_types
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}

